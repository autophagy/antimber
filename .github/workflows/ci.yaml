---
name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ci
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '∅')
    uses: ./.github/workflows/build.yaml
    secrets: inherit
